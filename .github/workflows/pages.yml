name: Publicar en GitHub Pages

on:
  push:
    branches:
      - claude/romantic-site-flower-carousel-nv4mtz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# si se pushea dos veces seguidas, publica la última
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4

      - name: Preparar Pages (y activarlo si hace falta)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
