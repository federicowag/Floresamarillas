name: Publicar en GitHub Pages

# GitHub Pages sirve el sitio desde la rama gh-pages, así que cada vez
# que se pushea a la rama de trabajo copiamos todo para allá y GitHub
# lo publica solo.

on:
  push:
    branches:
      - claude/romantic-site-flower-carousel-nv4mtz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4

      - name: Copiar el sitio a gh-pages
        run: git push origin HEAD:gh-pages --force
